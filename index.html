<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kama's Birthday Trip 2026</title>
    <meta name="theme-color" content="#FFFDF5">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="apple-touch-icon" href="./apple-touch-icon.png">
    <link rel="icon" href="./apple-touch-icon.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        /* --- 質感奶油色系 --- */
        :root {
            --bg-cream: #F9F7F2;      /* 溫潤米白 */
            --card-white: #FFFFFF;    
            --text-main: #4A4A4A;     /* 深灰質感 */
            --text-sub: #8C8C8C;      
            --accent-latte: #C7B299;  /* 拿鐵色 */
            --tag-bg: #F5F5F0;        
        }

        body {
            /* 使用系統原生字體，在手機上閱讀最舒適 */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans TC", sans-serif;
            background-color: var(--bg-cream);
            color: var(--text-main);
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior-y: none;
            line-height: 1.6;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .soft-shadow { box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03); }
        
        /* Tab 按鈕優化 */
        .tab-btn {
            transition: all 0.3s ease;
            background-color: transparent;
            color: #999;
            border-radius: 20px;
            font-weight: 500;
            letter-spacing: 0.5px;
        }
        .tab-btn.active {
            background-color: #4A4A4A;
            color: #FFF;
            box-shadow: 0 4px 12px rgba(74, 74, 74, 0.2);
        }

        /* 標籤設計 */
        .tag {
            display: inline-flex;
            align-items: center;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-right: 6px;
            margin-bottom: 6px;
            letter-spacing: 0.02em;
        }
        .tag-food { background-color: #FFF8E1; color: #F59E0B; } 
        .tag-spot { background-color: #F1F8E9; color: #558B2F; } 
        .tag-cold { background-color: #E3F2FD; color: #1976D2; border: 1px solid #BBDEFB;} 
        .tag-alert { background-color: #FFEBEE; color: #D32F2F; } 
        .tag-luxury { background-color: #F3E5F5; color: #7B1FA2; border: 1px solid #E1BEE7;}

        /* 時間軸線條 */
        .timeline-line {
            position: absolute;
            left: 23px;
            top: 45px;
            bottom: 30px;
            width: 1px;
            background-color: #E0E0E0;
            z-index: 0;
        }
        
        h1, h2, h3 { font-weight: 700; letter-spacing: -0.02em; }

        /* --- 驚喜彈窗動畫 --- */
        .modal-enter { opacity: 0; transform: scale(0.9); }
        .modal-enter-active { opacity: 1; transform: scale(1); transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .confetti {
            position: absolute;
            width: 10px; 
            height: 10px;
            background-color: #f00;
            animation: confetti-fall 3s linear infinite;
        }
        @keyframes confetti-fall {
            0% { transform: translateY(-100vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
        }
        
        /* 簡單的淡入動畫 */
        .fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="pb-32">

            <div class="bg-blue-50 rounded-xl p-5 mb-6 border border-blue-100">
                <p class="text-sm text-gray-400 font-bold uppercase mb-1">THE TRUTH IS</p>
                <div class="text-2xl font-bold text-blue-800 mb-1">我們要去日本九州！</div>
                <div class="text-4xl my-2">✈️ 🇯🇵 🍜</div>

                    { time: "10:30", title: "見晴懷古步道", icon: "fa-camera", location: "見晴古道",

                    { time: "12:30", title: "午餐：礁溪甕窯雞", icon: "fa-fire", location: "礁溪", 
                      desc: "下山後的第一餐！皮脆肉嫩的烤雞，補充熱量。",

                ]
            },
            {
                date: "1/13 (一)",
                title: "悠閒回程",
                weather: { temp: "20°C", icon: "fa-sun", label: "溫暖", isCold: false },
                events: [
                    { time: "11:00", title: "退房", icon: "fa-suitcase", location: "飯店", desc: "睡飽飽，悠閒退房。" },
                    { time: "12:30", title: "午餐：十一街麵食館", icon: "fa-bowl-rice", location: "竹北", 
                      desc: "回程順路吃竹北人氣名店，必點葫瓜水餃與滷味。", 
                      tags: [{type: "food", text: "人氣美食"}] },
                    { time: "14:00", title: "送姊姊回家", icon: "fa-user", location: "竹北", desc: "下次再一起旅行！" },
                    { time: "15:30", title: "回到彰化", icon: "fa-home", location: "彰化", desc: "平安抵達溫暖的家。" }
                ]

        // --- 資訊頁內容 (包含驚喜按鈕) ---
        const infoContent = `
            <div class="pb-24 animate-fade-in">
                <div class="bg-white rounded-3xl p-6 soft-shadow mb-6 border border-gray-50">
                    <h2 class="text-lg font-bold text-[#333] mb-5 border-b border-gray-100 pb-3 flex items-center">
                        <span class="w-1 h-5 bg-[#C7B299] rounded-full mr-2"></span>住宿一覽
                    </h2>
                    <div class="space-y-5">
                        <div class="flex">
                            <div class="w-12 pt-1 text-xs font-bold text-gray-400">Day 1</div>
                            <div>
                                <div class="font-bold text-[#333]">羅東特色民宿</div>
                                <div class="text-xs text-gray-500 mt-0.5">近夜市，交通方便。</div>
                            </div>
                        </div>
                        <div class="flex">
                            <div class="w-12 pt-1 text-xs font-bold text-gray-400">Day 2</div>
                            <div>
                                <div class="font-bold text-[#333]">大同鄉山腳民宿</div>
                                <div class="text-xs text-gray-500 mt-0.5">山下前哨站，幽靜舒適。</div>
                            </div>
                        </div>
                        <div class="flex">
                            <div class="w-12 pt-1 text-xs font-bold text-blue-400">Day 3</div>
                            <div>
                                <div class="font-bold text-[#333]">太平山莊</div>
                                <div class="text-xs text-blue-500 font-bold mt-0.5 flex items-center"><i class="fas fa-snowflake mr-1"></i> 極冷注意！請備足保暖衣物。</div>
                            </div>
                        </div>
                        <div class="flex bg-[#F3E5F5] p-3 rounded-xl -mx-2 border border-purple-50">
                            <div class="w-12 pt-1 text-xs font-bold text-purple-400">Day 4</div>
                            <div>
                                <div class="font-bold text-purple-900">礁溪頂級溫泉酒店</div>
                                <div class="text-xs text-purple-600 mt-0.5">一泊二食奢華方案。</div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="bg-red-50 rounded-3xl p-6 border border-red-100 mb-6">
                    <h2 class="text-lg font-bold text-red-800 mb-3 flex items-center">
                        <i class="fas fa-exclamation-circle mr-2"></i>行前重要提醒
                    </h2>
                    <ul class="text-sm text-red-800 space-y-3 leading-relaxed">
                        <li class="flex items-start"><i class="fas fa-check mt-1 mr-2 opacity-50"></i><span><strong>極寒警報：</strong>Day 3 & 4 山上氣溫接近 0 度，請務必攜帶羽絨衣、毛帽、手套！</span></li>
                        <li class="flex items-start"><i class="fas fa-check mt-1 mr-2 opacity-50"></i><span><strong>好走的鞋：</strong>見晴與翠峰湖步道可能濕滑，建議穿防滑鞋。</span></li>
                        <li class="flex items-start"><i class="fas fa-check mt-1 mr-2 opacity-50"></i><span><strong>暈車藥：</strong>上太平山路途蜿蜒，建議事先準備。</span></li>
                    </ul>
                </div>

                <button onclick="triggerSurprise()" class="w-full bg-gradient-to-r from-[#C7B299] to-[#bca588] text-white font-bold py-4 rounded-3xl shadow-lg flex items-center justify-center space-x-2 active:scale-95 transition-transform">
                    <i class="fas fa-gift animate-bounce"></i>
                    <span>✨ 點擊查看隱藏版驚喜</span>
                </button>
            </div>
        `;

        // --- 渲染邏輯 ---
        let currentDay = 0;

        function renderDay(dayIndex) {
            const container = document.getElementById('app-container');
            const data = itineraryData[dayIndex];
            
            // 更新上方天氣
            const weatherWidget = document.getElementById('weather-widget');
            const isCold = data.weather.isCold;
            weatherWidget.innerHTML = `
                <div class="text-2xl ${isCold ? 'text-blue-500' : 'text-orange-400'}"><i class="fas ${data.weather.icon}"></i></div>
                <div class="text-right">
                    <div class="text-[10px] text-gray-400 uppercase font-bold tracking-wider">${data.weather.label}</div>
                    <div class="text-lg font-bold text-[#333] leading-none">${data.weather.temp}</div>
                </div>
            `;
            if(isCold) {
                weatherWidget.classList.add('bg-blue-50', 'border-blue-100');
                weatherWidget.classList.remove('bg-white', 'border-gray-100');
            } else {
                weatherWidget.classList.remove('bg-blue-50', 'border-blue-100');
                weatherWidget.classList.add('bg-white', 'border-gray-100');
            }
            
            // 生成內容
            let html = `<div class="relative pb-10 fade-in">`;
            html += `<div class="timeline-line"></div>`;

            data.events.forEach((event, idx) => {
                let tagsHtml = '';
                if(event.tags) {
                    tagsHtml = `<div class="mt-3 flex flex-wrap">` + 
                        event.tags.map(t => `<span class="tag tag-${t.type}">${t.text}</span>`).join('') + 
                        `</div>`;
                }

                html += `
                    <div class="relative pl-12 mb-6 group">
                        <div class="absolute left-0 top-0 w-12 h-12 bg-white rounded-full border border-gray-100 flex items-center justify-center z-10 soft-shadow text-gray-600 group-hover:scale-105 transition-transform">
                            <i class="fas ${event.icon} text-lg"></i>
                        </div>
                        
                        <div class="bg-white rounded-2xl p-5 soft-shadow border border-gray-50/50">
                            <div class="flex justify-between items-start mb-1">
                                <div>
                                    <span class="text-[10px] font-bold text-gray-400 bg-gray-50 px-2 py-1 rounded mb-2 inline-block tracking-wide">${event.time}</span>
                                    <h3 class="text-lg font-bold text-[#333]">${event.title}</h3>
                                </div>
                            </div>
                            
                            <p class="text-sm text-gray-500 mb-2 leading-relaxed font-light">${event.desc}</p>
                            ${tagsHtml}
                        </div>
                    </div>
                `;
            });

            html += `</div>`;
            container.innerHTML = html;
            
            // 更新 Tab
            document.querySelectorAll('.tab-btn').forEach((el, idx) => {
                if(idx === dayIndex) el.classList.add('active');
                else el.classList.remove('active');
            });
        }

        function switchDay(index) {
            currentDay = index;
            renderDay(index);
            window.scrollTo({top: 0, behavior: 'smooth'});
        }

        function showItinerary() {
            switchDay(currentDay);
        }

        function showInfo() {
            const container = document.getElementById('app-container');
            container.innerHTML = infoContent;
            window.scrollTo({top: 0, behavior: 'smooth'});
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        }

        // --- 驚喜邏輯 ---
        function triggerSurprise() {
            const modal = document.getElementById('surprise-modal');
            const content = document.getElementById('modal-content');
            
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            
            createConfetti();
            
            setTimeout(() => {
                content.classList.add('modal-enter-active');
            }, 10);
        }

        function closeSurprise() {
            // 這個函數雖然保留著，但目前按鈕已經直接跳轉，不需要它了。
            // 除非你想做成「關閉後再跳轉」，但直接跳轉比較乾脆。
            const modal = document.getElementById('surprise-modal');
            const content = document.getElementById('modal-content');
            
            content.classList.remove('modal-enter-active');
            
            setTimeout(() => {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
                document.querySelectorAll('.confetti').forEach(el => el.remove());
            }, 300);
        }

        function createConfetti() {
            const colors = ['#EF5350', '#EC407A', '#AB47BC', '#7E57C2', '#42A5F5', '#26C6DA', '#26A69A', '#66BB6A', '#FFEE58', '#FFA726', '#FF7043'];
            const modal = document.getElementById('surprise-modal');
            
            for(let i=0; i<50; i++) {
                const conf = document.createElement('div');
                conf.classList.add('confetti');
                conf.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                // 限制在 95vw 避免出現卷軸
                conf.style.left = Math.random() * 95 + 'vw'; 
                conf.style.animationDuration = (Math.random() * 2 + 2) + 's';
                conf.style.animationDelay = (Math.random() * 1) + 's';
                modal.appendChild(conf);
                
                setTimeout(() => conf.remove(), 4000);
            }
        }

        // 初始化
        renderDay(0);

    </script>
</body>
</html>
