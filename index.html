        /* --- 質感奶油色系 --- */
        :root {
            --bg-cream: #F9F7F2;

            --text-main: #4A4A4A;     
            --text-sub: #8C8C8C;

            --tag-bg: #F5F5F0;

        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans TC", sans-serif;
            background-color: var(--bg-cream);
            color: var(--text-main);
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior-y: none;
            line-height: 1.6;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .soft-shadow { box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03); }
        
        /* Tab 按鈕優化 */
        .tab-btn {
            transition: all 0.3s ease;
            background-color: transparent;
            color: #999;
            border-radius: 20px;
            font-weight: 500;
            letter-spacing: 0.5px;
        }
        .tab-btn.active {
            background-color: #4A4A4A;
            color: #FFF;
            box-shadow: 0 4px 12px rgba(74, 74, 74, 0.2);
        }

        /* 標籤設計 */
        .tag {
            display: inline-flex;
            align-items: center;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-right: 6px;
            margin-bottom: 6px;
            letter-spacing: 0.02em;
        }
        .tag-food { background-color: #FFF8E1; color: #F59E0B; } 
        .tag-spot { background-color: #F1F8E9; color: #558B2F; } 
        .tag-cold { background-color: #E3F2FD; color: #1976D2; border: 1px solid #BBDEFB;} 
        .tag-alert { background-color: #FFEBEE; color: #D32F2F; } 
        .tag-luxury { background-color: #F3E5F5; color: #7B1FA2; border: 1px solid #E1BEE7;}

        /* 時間軸線條 */
        .timeline-line {
            position: absolute;
            left: 23px;
            top: 45px;
            bottom: 30px;
            width: 1px;
            background-color: #E0E0E0;
            z-index: 0;
        }
        
        h1, h2, h3 { font-weight: 700; letter-spacing: -0.02em; }

        /* --- 彈窗動畫 --- */
        .modal-enter { opacity: 0; transform: scale(0.95) translateY(10px); }
        .modal-enter-active { opacity: 1; transform: scale(1) translateY(0); transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); }
        
        /* 撒花特效修正 - 確保從螢幕最上方落下，不卡在中間 */
        .confetti {
            position: fixed; /* 改成 fixed，確保相對於螢幕定位 */
            top: -20px;      /* 預設在螢幕上方 */
            width: 10px; 
            height: 10px;
            background-color: #f00;
            animation: confetti-fall 3s linear infinite;
            z-index: 9999;   /* 確保在最上層 */
            border-radius: 50%;
            pointer-events: none; /* 讓點擊可以穿透花瓣 */
        }
        @keyframes confetti-fall {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
        }
        
        /* 機票專用樣式 */
        .font-oswald { font-family: 'Oswald', sans-serif; letter-spacing: 0.05em; }
        
        .ticket-shadow {
            box-shadow: 0 20px 40px -10px rgba(26, 35, 126, 0.3);

        .btn-navy-gradient {
            background: linear-gradient(to bottom, #212c8f, #1A237E);
            box-shadow: 0 4px 15px rgba(26, 35, 126, 0.4);
        }

        .fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

                            <div>
                                <div class="font-bold text-[#333]">太平山莊</div>
                                <div class="text-xs text-blue-500 font-bold mt-0.5 flex items-center"><i class="fas fa-snowflake mr-1"></i> 極冷注意！請備足保暖衣物。</div>
                            </div>
                        </div>
                        <div class="flex bg-[#F3E5F5] p-3 rounded-xl -mx-2 border border-purple-50">
                            <div class="w-12 pt-1 text-xs font-bold text-purple-400">Day 4</div>
                            <div>
                                <div class="font-bold text-purple-900">礁溪頂級溫泉酒店</div>
                                <div class="text-xs text-purple-600 mt-0.5">一泊二食奢華方案。</div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="bg-red-50 rounded-3xl p-6 border border-red-100 mb-6">
                    <h2 class="text-lg font-bold text-red-800 mb-3 flex items-center">
                        <i class="fas fa-exclamation-circle mr-2"></i>行前重要提醒
                    </h2>
                    <ul class="text-sm text-red-800 space-y-3 leading-relaxed">
                        <li class="flex items-start"><i class="fas fa-check mt-1 mr-2 opacity-50"></i><span><strong>極寒警報：</strong>Day 3 & 4 山上氣溫接近 0 度，請務必攜帶羽絨衣、毛帽、手套！</span></li>
                        <li class="flex items-start"><i class="fas fa-check mt-1 mr-2 opacity-50"></i><span><strong>好走的鞋：</strong>見晴與翠峰湖步道可能濕滑，建議穿防滑鞋。</span></li>
                        <li class="flex items-start"><i class="fas fa-check mt-1 mr-2 opacity-50"></i><span><strong>暈車藥：</strong>上太平山路途蜿蜒，建議事先準備。</span></li>
                    </ul>
                </div>
            </div>
        `;

        // --- 渲染邏輯 ---
        let currentDay = 0;

        function renderDay(dayIndex) {
            const container = document.getElementById('app-container');
            const data = itineraryData[dayIndex];
            
            // 更新上方天氣
            const weatherWidget = document.getElementById('weather-widget');
            const isCold = data.weather.isCold;
            weatherWidget.innerHTML = `
                <div class="text-2xl ${isCold ? 'text-blue-500' : 'text-orange-400'}"><i class="fas ${data.weather.icon}"></i></div>
                <div class="text-right">
                    <div class="text-[10px] text-gray-400 uppercase font-bold tracking-wider">${data.weather.label}</div>
                    <div class="text-lg font-bold text-[#333] leading-none">${data.weather.temp}</div>
                </div>
            `;
            if(isCold) {
                weatherWidget.classList.add('bg-blue-50', 'border-blue-100');
                weatherWidget.classList.remove('bg-white', 'border-gray-100');
            } else {
                weatherWidget.classList.remove('bg-blue-50', 'border-blue-100');
                weatherWidget.classList.add('bg-white', 'border-gray-100');
            }
            
            // 生成內容
            let html = `<div class="relative pb-10 fade-in">`;
            html += `<div class="timeline-line"></div>`;

            data.events.forEach((event, idx) => {
                let tagsHtml = '';
                if(event.tags) {
                    tagsHtml = `<div class="mt-3 flex flex-wrap">` + 
                        event.tags.map(t => `<span class="tag tag-${t.type}">${t.text}</span>`).join('') + 
                        `</div>`;
                }
                
                // 處理驚喜按鈕的邏輯
                let surpriseBtnHtml = '';
                if (event.hasSurprise) {
                    surpriseBtnHtml = `
                        <button onclick="checkTimeAndSurprise()" class="mt-4 w-full border border-[#C7B299] text-[#a68b70] text-sm py-2.5 rounded-xl hover:bg-[#F9F7F2] transition flex items-center justify-center gap-2 group-hover:bg-[#C7B299] group-hover:text-white">
                            <i class="fas fa-gift animate-pulse"></i>
                            <span>領取壽星專屬小禮物</span>
                        </button>
                    `;
                }

                html += `
                    <div class="relative pl-12 mb-6 group">
                        <div class="absolute left-0 top-0 w-12 h-12 bg-white rounded-full border border-gray-100 flex items-center justify-center z-10 soft-shadow text-gray-600 group-hover:scale-105 transition-transform">
                            <i class="fas ${event.icon} text-lg"></i>
                        </div>
                        
                        <div class="bg-white rounded-2xl p-5 soft-shadow border border-gray-50/50">
                            <div class="flex justify-between items-start mb-1">
                                <div>
                                    <span class="text-[10px] font-bold text-gray-400 bg-gray-50 px-2 py-1 rounded mb-2 inline-block tracking-wide">${event.time}</span>
                                    <h3 class="text-lg font-bold text-[#333]">${event.title}</h3>
                                </div>
                            </div>
                            
                            <p class="text-sm text-gray-500 mb-2 leading-relaxed font-light">${event.desc}</p>
                            ${tagsHtml}
                            ${surpriseBtnHtml}
                        </div>
                    </div>
                `;
            });

            html += `</div>`;
            container.innerHTML = html;
            
            // 更新 Tab
            document.querySelectorAll('.tab-btn').forEach((el, idx) => {
                if(idx === dayIndex) el.classList.add('active');
                else el.classList.remove('active');
            });
        }

        function switchDay(index) {
            currentDay = index;
            renderDay(index);
            window.scrollTo({top: 0, behavior: 'smooth'});
        }

        function showItinerary() {
            switchDay(currentDay);
        }

        function showInfo() {
            const container = document.getElementById('app-container');
            container.innerHTML = infoContent;
            window.scrollTo({top: 0, behavior: 'smooth'});
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        }

        // --- 驚喜邏輯 ---
        function checkTimeAndSurprise() {
            const now = new Date();
            const modal = document.getElementById('surprise-modal');
            const fakeCoupon = document.getElementById('fake-coupon');
            const realTicket = document.getElementById('real-ticket');
            
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            
            // 隱藏所有內容，準備顯示
            fakeCoupon.classList.add('hidden');
            realTicket.classList.add('hidden');
            
            if (now >= TARGET_DATE) {
                // 時間到了：顯示真機票 + 撒花
                realTicket.classList.remove('hidden');
                setTimeout(() => {
                    realTicket.classList.add('modal-enter-active');
                }, 10);
                createConfetti(); // 呼叫修正後的撒花
            } else {
                // 時間未到：顯示 Second Floor 訂位資訊
                fakeCoupon.classList.remove('hidden');
                setTimeout(() => {
                    fakeCoupon.classList.add('modal-enter-active');
                }, 10);
            }
        }

        function closeModal() {
            const modal = document.getElementById('surprise-modal');
            const fakeCoupon = document.getElementById('fake-coupon');
            const realTicket = document.getElementById('real-ticket');

            fakeCoupon.classList.remove('modal-enter-active');
            realTicket.classList.remove('modal-enter-active');
            
            setTimeout(() => {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
                document.querySelectorAll('.confetti').forEach(el => el.remove());
            }, 300);
        }

        // 撒花函式 (重要修正：使用 fixed position 並隨機分佈在 body 上)
        function createConfetti() {
            const colors = ['#EF5350', '#EC407A', '#AB47BC', '#7E57C2', '#42A5F5', '#26C6DA', '#26A69A', '#66BB6A', '#FFEE58', '#FFA726', '#FF7043'];
            const body = document.body; // 改為附加在 body 上
            
            for(let i=0; i<100; i++) {
                const conf = document.createElement('div');
                conf.classList.add('confetti');
                conf.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                conf.style.left = Math.random() * 100 + 'vw'; 
                conf.style.width = (Math.random() * 8 + 5) + 'px';
                conf.style.height = conf.style.width;
                conf.style.animationDuration = (Math.random() * 2 + 2) + 's';
                conf.style.animationDelay = (Math.random() * 1) + 's';
                body.appendChild(conf); // 附加到 body
                
                // 動畫結束後自動移除
                setTimeout(() => {
                    conf.remove();
                }, 5000);
            }
        }
        
        // 初始化
        renderDay(0);
    </script>
</body>
</html>
